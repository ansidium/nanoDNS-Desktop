[package]
name = "nanodns-desktop"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Native Windows desktop edition of nanoDNS"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
tray-icon = { version = "=0.25.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
if-addrs = "0.14"
winreg = "0.55"
fs2 = "0.4"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinSock", "Win32_Globalization"] }
base64 = "0.22"
raw-window-handle = "0.6.2"
winit = { version = "=0.30.13", default-features = false }

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
